name: ci
# Correctness only: format, lint, type check and tests. Builds and releases
# are made locally. src/syscalls.wasm is committed, so no Rust/WASM build here.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: riagentic/aio
          ref: v1.0.25-beta
          path: dep/aio
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/ test/
      - name: Rust parser tests
        run: cd rust && cargo test
      - run: deno test -A test/
